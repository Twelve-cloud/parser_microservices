services:
  parser-mongo:
    # image: mongo:7.0-rc-jammy
    build: ./infrastructure/twich_parser_service/compose/docker/mongo
    hostname: parser-mongo
    container_name: parser-mongo
    user: mongodb
    entrypoint: ["/bin/mongo/entrypoint.sh"]
    command: ["mongod", "--config", "/etc/mongo/mongo.conf"]
    expose: ["${COMPOSE_TWT_PARSER_MONGO_PORT}/tcp"]
    env_file:
      - path: ./infrastructure/twich_parser_service/compose/env/mongo/.env
        required: true
    volumes:
      - type: bind
        source: ./infrastructure/twich_parser_service/compose/entrypoints/mongo
        target: /bin/mongo
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ./infrastructure/twich_parser_service/compose/configs/mongo
        target: /etc/templates/mongo
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ./infrastructure/twich_parser_service/compose/certs/mongo
        target: /etc/ssl/mongo
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ./infrastructure/common/compose/certs/ca/ca.pem
        target: /etc/ssl/ca/ca.pem
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: volume
        source: parser-mongo-data
        target: /storage/mongo
        volume:
          nocopy: false
      - type: volume
        source: parser-mongo-config
        target: /etc/mongo
        volume:
          nocopy: false
    healthcheck:
      test: ["CMD-SHELL", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s
      start_interval: 10s
    logging:
      driver: json-file
      options:
        labels-regex: "^.+"
    deploy:
      resources:
        limits:
          cpus: ${COMPOSE_TWT_PARSER_MONGO_CPUS_LIMIT}
          memory: ${COMPOSE_TWT_PARSER_MONGO_MEMORY_LIMIT}
        reservations:
          cpus: ${COMPOSE_TWT_PARSER_MONGO_CPUS_RESERVATION}
          memory: ${COMPOSE_TWT_PARSER_MONGO_MEMORY_RESERVATION}
    networks:
      parser-mongo-network:
        ipv4_address: ${COMPOSE_TWT_PARSER_MONGO_IP_ADDRESS}
    pull_policy: missing
    restart: always

networks:
  parser-mongo-network:
    name: parser-mongo-network
    driver: bridge
    internal: false
    external: false
    attachable: false
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: ${COMPOSE_TWT_PARSER_MONGO_NETWORK_SUBNET}
          ip_range: ${COMPOSE_TWT_PARSER_MONGO_NETWORK_IP_RANGE}
          gateway: ${COMPOSE_TWT_PARSER_MONGO_NETWORK_GATEWAY}

volumes:
  parser-mongo-data:
    name: parser-mongo-data
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "\
        size=${COMPOSE_TWT_PARSER_MONGO_DATA_SIZE},\
        uid=${COMPOSE_TWT_PARSER_MONGO_VOLUME_UID},\
        gid=${COMPOSE_TWT_PARSER_MONGO_VOLUME_GID}\
        "

  parser-mongo-config:
    name: parser-mongo-config
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "\
        size=${COMPOSE_TWT_PARSER_MONGO_CONFIG_SIZE},\
        uid=${COMPOSE_TWT_PARSER_MONGO_VOLUME_UID},\
        gid=${COMPOSE_TWT_PARSER_MONGO_VOLUME_GID}\
        "
