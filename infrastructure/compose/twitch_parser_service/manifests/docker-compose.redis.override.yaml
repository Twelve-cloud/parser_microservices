services:
  parser-redis:
    # image: redis:7.4.0-alpine
    build:
      context: ${COMPOSE_TWT_PARSER_REDIS_CONTEXT}
      dockerfile: ${COMPOSE_TWT_PARSER_REDIS_DOCKERFILE}
    hostname: parser-redis
    container_name: parser-redis
    user: redis
    entrypoint: ["${COMPOSE_TWT_PARSER_REDIS_ENTRYPOINT_TARGET}"]
    command:
      [
        "redis-server",
        "${COMPOSE_TWT_PARSER_REDIS_CONFIG_TARGET}",
        "--user ${COMPOSE_TWT_PARSER_REDIS_USERNAME} on >${COMPOSE_TWT_PARSER_REDIS_PASSWORD} ~* &* +@all",
        "--user default off nopass -@all",
        "--requirepass ${COMPOSE_TWT_PARSER_REDIS_PASSWORD}",
      ]
    expose: ["${COMPOSE_TWT_PARSER_REDIS_PORT}/tcp"]
    env_file:
      - path: ${COMPOSE_TWT_PARSER_REDIS_ENV}
        required: true
    volumes:
      - type: bind
        source: ${COMPOSE_TWT_PARSER_REDIS_ENTRYPOINT_FOLDER_SOURCE}
        target: ${COMPOSE_TWT_PARSER_REDIS_ENTRYPOINT_FOLDER_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${COMPOSE_TWT_PARSER_REDIS_TEMPLATE_FOLDER_SOURCE}
        target: ${COMPOSE_TWT_PARSER_REDIS_TEMPLATE_FOLDER_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${COMPOSE_TWT_PARSER_REDIS_SSL_CRT_FOLDER_SOURCE}
        target: ${COMPOSE_TWT_PARSER_REDIS_SSL_CRT_FOLDER_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${COMPOSE_TWT_PARSER_REDIS_SSL_CA_CRT_SOURCE}
        target: ${COMPOSE_TWT_PARSER_REDIS_SSL_CA_CRT_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: volume
        source: parser-redis-data
        target: ${COMPOSE_TWT_PARSER_REDIS_STORAGE_FOLDER_TARGET}
        volume:
          nocopy: false
      - type: volume
        source: parser-redis-config
        target: ${COMPOSE_TWT_PARSER_REDIS_CONFIG_FOLDER_TARGET}
        volume:
          nocopy: false
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--no-auth-warning",
          "-h",
          "${COMPOSE_TWT_PARSER_REDIS_HOST}",
          "-p",
          "${COMPOSE_TWT_PARSER_REDIS_PORT}",
          "--tls",
          "--cert",
          "${COMPOSE_TWT_PARSER_REDIS_SSL_CRT_TARGET}",
          "--key",
          "${COMPOSE_TWT_PARSER_REDIS_SSL_KEY_TARGET}",
          "--cacert",
          "${COMPOSE_TWT_PARSER_REDIS_SSL_CA_CRT_TARGET}",
          "--user",
          "${COMPOSE_TWT_PARSER_REDIS_USERNAME}",
          "--pass",
          "${COMPOSE_TWT_PARSER_REDIS_PASSWORD}",
          "ping",
        ]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s
      start_interval: 10s
    logging:
      driver: json-file
      options:
        labels-regex: "^.+"
    deploy:
      resources:
        limits:
          cpus: ${COMPOSE_TWT_PARSER_REDIS_CPUS_LIMIT}
          memory: ${COMPOSE_TWT_PARSER_REDIS_MEMORY_LIMIT}
        reservations:
          cpus: ${COMPOSE_TWT_PARSER_REDIS_CPUS_RESERVATION}
          memory: ${COMPOSE_TWT_PARSER_REDIS_MEMORY_RESERVATION}
    networks:
      parser-redis-network:
        ipv4_address: ${COMPOSE_TWT_PARSER_REDIS_IP_ADDRESS}
    pull_policy: missing
    restart: always

networks:
  parser-redis-network:
    name: parser-redis-network
    driver: bridge
    internal: false
    external: false
    attachable: false
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: ${COMPOSE_TWT_PARSER_REDIS_NETWORK_SUBNET}
          ip_range: ${COMPOSE_TWT_PARSER_REDIS_NETWORK_IP_RANGE}
          gateway: ${COMPOSE_TWT_PARSER_REDIS_NETWORK_GATEWAY}

volumes:
  parser-redis-data:
    name: parser-redis-data
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "\
        size=${COMPOSE_TWT_PARSER_REDIS_DATA_SIZE},\
        uid=${COMPOSE_TWT_PARSER_REDIS_VOLUME_UID},\
        gid=${COMPOSE_TWT_PARSER_REDIS_VOLUME_GID}\
        "

  parser-redis-config:
    name: parser-redis-config
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "\
        size=${COMPOSE_TWT_PARSER_REDIS_CONFIG_SIZE},\
        uid=${COMPOSE_TWT_PARSER_REDIS_VOLUME_UID},\
        gid=${COMPOSE_TWT_PARSER_REDIS_VOLUME_GID}\
        "
