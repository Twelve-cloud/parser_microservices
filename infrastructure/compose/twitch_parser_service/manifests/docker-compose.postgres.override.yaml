services:
  parser-postgres:
    # image: postgres:16.3-alpine3.20
    build:
      context: ${COMPOSE_TWT_PARSER_POSTGRES_CONTEXT}
      dockerfile: ${COMPOSE_TWT_PARSER_POSTGRES_DOCKERFILE}
    hostname: ${COMPOSE_TWT_PARSER_POSTGRES_HOST}
    container_name: parser-postgres
    user: postgres
    entrypoint: ["${COMPOSE_TWT_PARSER_POSTGRES_ENTRYPOINT_TARGET}"]
    command: ["postgres", "-c", "config_file=${COMPOSE_TWT_PARSER_POSTGRES_CONFIG_TARGET}"]
    expose: ["${COMPOSE_TWT_PARSER_POSTGRES_PORT}/tcp"]
    env_file:
      - path: ${COMPOSE_TWT_PARSER_POSTGRES_ENV}
        required: true
    volumes:
      - type: bind
        source: ${COMPOSE_TWT_PARSER_POSTGRES_ENTRYPOINT_FOLDER_SOURCE}
        target: ${COMPOSE_TWT_PARSER_POSTGRES_ENTRYPOINT_FOLDER_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${COMPOSE_TWT_PARSER_POSTGRES_TEMPLATE_FOLDER_SOURCE}
        target: ${COMPOSE_TWT_PARSER_POSTGRES_TEMPLATE_FOLDER_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${COMPOSE_TWT_PARSER_POSTGRES_SSL_CRT_FOLDER_SOURCE}
        target: ${COMPOSE_TWT_PARSER_POSTGRES_SSL_CRT_FOLDER_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${COMPOSE_TWT_PARSER_POSTGRES_SSL_CA_CRT_SOURCE}
        target: ${COMPOSE_TWT_PARSER_POSTGRES_SSL_CA_CRT_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: volume
        source: parser-postgres-data
        target: ${COMPOSE_TWT_PARSER_POSTGRES_STORAGE_FOLDER_TARGET}
        volume:
          nocopy: false
      - type: volume
        source: parser-postgres-config
        target: ${COMPOSE_TWT_PARSER_POSTGRES_CONFIG_FOLDER_TARGET}
        volume:
          nocopy: false
    healthcheck:
      test: [
          "CMD",
          "psql",
          "
          host=${COMPOSE_TWT_PARSER_POSTGRES_HOST}
          port=${COMPOSE_TWT_PARSER_POSTGRES_PORT}
          user=${COMPOSE_TWT_PARSER_POSTGRES_USER}
          password=${COMPOSE_TWT_PARSER_POSTGRES_PASS}
          dbname=${COMPOSE_TWT_PARSER_POSTGRES_DB}
          sslmode=verify-full
          sslrootcert=${COMPOSE_TWT_PARSER_POSTGRES_SSL_CA_CRT_TARGET}
          ",
          "-c",
          "SELECT 'OK'",
        ]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s
      start_interval: 10s
    logging:
      driver: json-file
      options:
        labels-regex: "^.+"
    deploy:
      resources:
        limits:
          cpus: ${COMPOSE_TWT_PARSER_POSTGRES_CPUS_LIMIT}
          memory: ${COMPOSE_TWT_PARSER_POSTGRES_MEMORY_LIMIT}
        reservations:
          cpus: ${COMPOSE_TWT_PARSER_POSTGRES_CPUS_RESERVATION}
          memory: ${COMPOSE_TWT_PARSER_POSTGRES_MEMORY_RESERVATION}
    networks:
      parser-postgres-network:
        ipv4_address: ${COMPOSE_TWT_PARSER_POSTGRES_IP_ADDRESS}
    pull_policy: missing
    restart: always

networks:
  parser-postgres-network:
    name: parser-postgres-network
    driver: bridge
    internal: false
    external: false
    attachable: false
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: ${COMPOSE_TWT_PARSER_POSTGRES_NETWORK_SUBNET}
          ip_range: ${COMPOSE_TWT_PARSER_POSTGRES_NETWORK_IP_RANGE}
          gateway: ${COMPOSE_TWT_PARSER_POSTGRES_NETWORK_GATEWAY}

volumes:
  parser-postgres-data:
    name: parser-postgres-data
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "\
        size=${COMPOSE_TWT_PARSER_POSTGRES_DATA_SIZE},\
        uid=${COMPOSE_TWT_PARSER_POSTGRES_VOLUME_UID},\
        gid=${COMPOSE_TWT_PARSER_POSTGRES_VOLUME_GID}\
        "

  parser-postgres-config:
    name: parser-postgres-config
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "\
        size=${COMPOSE_TWT_PARSER_POSTGRES_CONFIG_SIZE},\
        uid=${COMPOSE_TWT_PARSER_POSTGRES_VOLUME_UID},\
        gid=${COMPOSE_TWT_PARSER_POSTGRES_VOLUME_GID}\
        "
