services:
  redis-insight:
    #image: redis/redisinsight:2.60.0
    build:
      context: ${COMPOSE_COMMON_REDIS_INSIGHT_CONTEXT}
      dockerfile: ${COMPOSE_COMMON_REDIS_INSIGHT_DOCKERFILE}
    hostname: ${COMPOSE_COMMON_REDIS_INSIGHT_HOST}
    container_name: redis-insight
    user: node
    entrypoint: ["${COMPOSE_COMMON_REDIS_INSIGHT_ENTRYPOINT_TARGET}"]
    command: ["node", "redisinsight/api/dist/src/main"]
    expose: ["${COMPOSE_COMMON_REDIS_INSIGHT_PORT}/tcp"]
    env_file:
      - path: ${COMPOSE_COMMON_REDIS_INSIGHT_ENV}
        required: true
    volumes:
      - type: bind
        source: ${COMPOSE_COMMON_REDIS_INSIGHT_ENTRYPOINT_SOURCE}
        target: ${COMPOSE_COMMON_REDIS_INSIGHT_ENTRYPOINT_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${COMPOSE_COMMON_REDIS_INSIGHT_TEMPLATE_SOURCE}
        target: ${COMPOSE_COMMON_REDIS_INSIGHT_TEMPLATE_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${COMPOSE_COMMON_REDIS_INSIGHT_SSL_CRT_FOLDER_SOURCE}
        target: ${COMPOSE_COMMON_REDIS_INSIGHT_SSL_CRT_FOLDER_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: volume
        source: redisinsight-data
        target: ${COMPOSE_COMMON_REDIS_INSIGHT_STORAGE_FOLDER_TARGET}
        volume:
          nocopy: false
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "--no-check-certificate",
          "https://${COMPOSE_COMMON_REDIS_INSIGHT_HOST}:${COMPOSE_COMMON_REDIS_INSIGHT_PORT}/api/health",
        ]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s
      start_interval: 10s
    logging:
      driver: json-file
      options:
        labels-regex: "^.+"
    deploy:
      resources:
        limits:
          cpus: ${COMPOSE_COMMON_REDIS_INSIGHT_CPUS_LIMIT}
          memory: ${COMPOSE_COMMON_REDIS_INSIGHT_MEMORY_LIMIT}
        reservations:
          cpus: ${COMPOSE_COMMON_REDIS_INSIGHT_CPUS_RESERVATION}
          memory: ${COMPOSE_COMMON_REDIS_INSIGHT_MEMORY_RESERVATION}
    networks:
      redis-insight-network:
        ipv4_address: ${COMPOSE_COMMON_REDIS_INSIGHT_IP_ADDRESS}
      parser-redis-network:
    depends_on:
      parser-redis:
        restart: true
        condition: service_healthy
        required: true
    pull_policy: missing
    restart: always

  redis-insight-setup:
    image: curlimages/curl:8.10.1
    hostname: ${COMPOSE_COMMON_REDIS_INSIGHT_CURL_HOST}
    container_name: ri-curl
    user: curl_user
    entrypoint: ["${COMPOSE_COMMON_REDIS_INSIGHT_CURL_ENTRYPOINT_TARGET}"]
    command: ["true"]
    env_file:
      - path: ${COMPOSE_COMMON_REDIS_INSIGHT_CURL_ENV}
        required: true
    volumes:
      - type: bind
        source: ${COMPOSE_COMMON_REDIS_INSIGHT_CURL_ENTRYPOINT_SOURCE}
        target: ${COMPOSE_COMMON_REDIS_INSIGHT_CURL_ENTRYPOINT_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${COMPOSE_COMMON_REDIS_INSIGHT_CURL_SSL_CRT_FOLDER_SOURCE}
        target: ${COMPOSE_COMMON_REDIS_INSIGHT_CURL_SSL_CRT_FOLDER_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${COMPOSE_COMMON_REDIS_INSIGHT_CURL_SSL_CA_CRT_SOURCE}
        target: ${COMPOSE_COMMON_REDIS_INSIGHT_CURL_SSL_CA_CRT_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    logging:
      driver: json-file
      options:
        labels-regex: "^.+"
    deploy:
      resources:
        limits:
          cpus: ${COMPOSE_COMMON_REDIS_INSIGHT_CURL_CPUS_LIMIT}
          memory: ${COMPOSE_COMMON_REDIS_INSIGHT_CURL_MEMORY_LIMIT}
        reservations:
          cpus: ${COMPOSE_COMMON_REDIS_INSIGHT_CURL_CPUS_RESERVATION}
          memory: ${COMPOSE_COMMON_REDIS_INSIGHT_CURL_MEMORY_RESERVATION}
    networks:
      redis-insight-network:
        ipv4_address: ${COMPOSE_COMMON_REDIS_INSIGHT_CURL_IP_ADDRESS}
    depends_on:
      redis-insight:
        restart: true
        condition: service_healthy
        required: true
    pull_policy: missing
    restart: on-failure:3

  redis-insight-proxy:
    # image: nginx:1.27.1-alpine3.20
    build:
      context: ${COMPOSE_COMMON_REDIS_INSIGHT_NGINX_CONTEXT}
      dockerfile: ${COMPOSE_COMMON_REDIS_INSIGHT_NGINX_DOCKERFILE}
    hostname: ${COMPOSE_COMMON_REDIS_INSIGHT_NGINX_HOST}
    container_name: ri-nginx
    user: nginx
    entrypoint: ["${COMPOSE_COMMON_REDIS_INSIGHT_NGINX_ENTRYPOINT_TARGET}"]
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - name: redis-insight-port
        target: ${COMPOSE_COMMON_REDIS_INSIGHT_NGINX_PORT}
        published: ${COMPOSE_COMMON_REDIS_INSIGHT_NGINX_PUBLIC_PORT}
        host_ip: ${COMPOSE_COMMON_REDIS_INSIGHT_NGINX_HOST_IP}
        protocol: tcp
        mode: host
    env_file:
      - path: ${COMPOSE_COMMON_REDIS_INSIGHT_NGINX_ENV}
        required: true
    volumes:
      - type: bind
        source: ${COMPOSE_COMMON_REDIS_INSIGHT_NGINX_ENTRYPOINT_SOURCE}
        target: ${COMPOSE_COMMON_REDIS_INSIGHT_NGINX_ENTRYPOINT_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${COMPOSE_COMMON_REDIS_INSIGHT_NGINX_TEMPLATE_SOURCE}
        target: ${COMPOSE_COMMON_REDIS_INSIGHT_NGINX_TEMPLATE_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${COMPOSE_COMMON_REDIS_INSIGHT_NGINX_SSL_CRT_FOLDER_SOURCE}
        target: ${COMPOSE_COMMON_REDIS_INSIGHT_NGINX_SSL_CRT_FOLDER_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${COMPOSE_COMMON_REDIS_INSIGHT_NGINX_SSL_CA_CRT_SOURCE}
        target: ${COMPOSE_COMMON_REDIS_INSIGHT_NGINX_SSL_CA_CRT_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--silent",
          "--insecure",
          "--user",
          "${COMPOSE_COMMON_REDIS_INSIGHT_DEFAULT_EMAIL}:${COMPOSE_COMMON_REDIS_INSIGHT_DEFAULT_PASSWORD}",
          "https://${COMPOSE_COMMON_REDIS_INSIGHT_HOST}:${COMPOSE_COMMON_REDIS_INSIGHT_PORT}/api/health",
        ]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s
      start_interval: 10s
    logging:
      driver: json-file
      options:
        labels-regex: "^.+"
    deploy:
      resources:
        limits:
          cpus: ${COMPOSE_COMMON_REDIS_INSIGHT_NGINX_CPUS_LIMIT}
          memory: ${COMPOSE_COMMON_REDIS_INSIGHT_NGINX_MEMORY_LIMIT}
        reservations:
          cpus: ${COMPOSE_COMMON_REDIS_INSIGHT_NGINX_CPUS_RESERVATION}
          memory: ${COMPOSE_COMMON_REDIS_INSIGHT_NGINX_MEMORY_RESERVATION}
    networks:
      redis-insight-network:
        ipv4_address: ${COMPOSE_COMMON_REDIS_INSIGHT_NGINX_IP_ADDRESS}
    depends_on:
      redis-insight:
        restart: true
        condition: service_healthy
        required: true
    pull_policy: missing
    restart: always

networks:
  redis-insight-network:
    name: redis-insight-network
    driver: bridge
    internal: false
    external: false
    attachable: false
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: ${COMPOSE_COMMON_REDIS_INSIGHT_NETWORK_SUBNET}
          ip_range: ${COMPOSE_COMMON_REDIS_INSIGHT_NETWORK_IP_RANGE}
          gateway: ${COMPOSE_COMMON_REDIS_INSIGHT_NETWORK_GATEWAY}
  parser-redis-network:
    external: true

volumes:
  redisinsight-data:
    name: redisinsight-data
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "\
        size=${COMPOSE_COMMON_REDIS_INSIGHT_DATA_SIZE},\
        uid=${COMPOSE_COMMON_REDIS_INSIGHT_VOLUME_UID},\
        gid=${COMPOSE_COMMON_REDIS_INSIGHT_VOLUME_GID}\
        "
