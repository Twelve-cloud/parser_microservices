services:
  kafka:
    # image: apache/kafka:3.9.0
    build:
      context: ${COMPOSE_COMMON_KAFKA_CONTEXT}
      dockerfile: ${COMPOSE_COMMON_KAFKA_DOCKERFILE}
    hostname: ${COMPOSE_COMMON_KAFKA_HOST}
    container_name: kafka
    user: appuser
    entrypoint: ["${COMPOSE_COMMON_KAFKA_ENTRYPOINT_TARGET}"]
    command: ["/etc/kafka/docker/run"]
    expose: ["${COMPOSE_COMMON_KAFKA_PORT}/tcp"]
    env_file:
      - path: ${COMPOSE_COMMON_KAFKA_ENV}
        required: true
    volumes:
      - type: bind
        source: ${COMPOSE_COMMON_KAFKA_ENTRYPOINT_FOLDER_SOURCE}
        target: ${COMPOSE_COMMON_KAFKA_ENTRYPOINT_FOLDER_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${COMPOSE_COMMON_KAFKA_TEMPLATE_FOLDER_SOURCE}
        target: ${COMPOSE_COMMON_KAFKA_TEMPLATE_FOLDER_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${COMPOSE_COMMON_KAFKA_SSL_CRT_FOLDER_SOURCE}
        target: ${COMPOSE_COMMON_KAFKA_SSL_CRT_FOLDER_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: volume
        source: kafka-data
        target: ${COMPOSE_COMMON_KAFKA_STORAGE_FOLDER_TARGET}
        volume:
          nocopy: false
    healthcheck:
      test: [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-cluster.sh
          cluster-id
          --bootstrap-server
          ${COMPOSE_COMMON_KAFKA_HEALTHCHECK_BOOTSTRAP_SERVER}
          --config
          <(echo -e \"
          security.protocol=SSL\n
          ssl.truststore.location=${COMPOSE_COMMON_KAFKA_HEALTHCHECK_TRUSTSTURE_PATH}\n
          ssl.truststore.password=${COMPOSE_COMMON_KAFKA_HEALTHCHECK_TRUSTSTORE_PASSWORD}\"
          )",
        ]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s
      start_interval: 10s
    logging:
      driver: json-file
      options:
        labels-regex: "^.+"
    deploy:
      resources:
        limits:
          cpus: ${COMPOSE_COMMON_KAFKA_CPUS_LIMIT}
          memory: ${COMPOSE_COMMON_KAFKA_MEMORY_LIMIT}
        reservations:
          cpus: ${COMPOSE_COMMON_KAFKA_CPUS_RESERVATION}
          memory: ${COMPOSE_COMMON_KAFKA_MEMORY_RESERVATION}
    networks:
      kafka-network:
        ipv4_address: ${COMPOSE_COMMON_KAFKA_IP_ADDRESS}
    pull_policy: missing
    restart: always

networks:
  kafka-network:
    name: kafka-network
    driver: bridge
    internal: false
    external: false
    attachable: false
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: ${COMPOSE_COMMON_KAFKA_NETWORK_SUBNET}
          ip_range: ${COMPOSE_COMMON_KAFKA_NETWORK_IP_RANGE}
          gateway: ${COMPOSE_COMMON_KAFKA_NETWORK_GATEWAY}

volumes:
  kafka-data:
    name: kafka-data
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "\
        size=${COMPOSE_COMMON_KAFKA_DATA_SIZE},\
        uid=${COMPOSE_COMMON_KAFKA_VOLUME_UID},\
        gid=${COMPOSE_COMMON_KAFKA_VOLUME_GID}\
        "
