[ ca ]
default_ca              = ca_section

[ ca_section ]
dir                     = $ENV::INTERMEDIATE_CA_DIR

database                = $dir/database/index.txt
new_certs_dir           = $dir/issued

certificate             = $dir/ca.crt
private_key             = $dir/ca.key

rand_serial             = yes
unique_subject          = no

default_days            = 3650
default_md              = default

name_opt                = ca_default
cert_opt                = ca_default

policy                  = cert_policy_section

x509_extensions         = cert_extension_section
copy_extensions         = copy

crl_extensions          = crl_extension_section
crlnumber               = $dir/crl/crlnumber.txt
default_crl_days        = 30

[ req ]
prompt                  = no
distinguished_name      = intermediate_cert_distinguished_name_section

[ intermediate_cert_distinguished_name_section ]
countryName             = CO
stateOrProvinceName     = stateOrProvinceName
localityName            = localityName
organizationName        = organizationName
commonName              = Intermediate CA

[ cert_policy_section ]
countryName             = optional
stateOrProvinceName     = optional
localityName            = optional
organizationName        = optional
organizationalUnitName  = optional
emailAddress            = optional
commonName              = supplied

[ cert_extension_section ]
subjectKeyIdentifier    = hash
authorityKeyIdentifier  = keyid:always, issuer
basicConstraints        = critical, CA:FALSE
keyUsage                = critical, digitalSignature, keyEncipherment
extendedKeyUsage        = critical, serverAuth, clientAuth
# crlDistributionPoints   = URI:http://crl_server_url/intermediate_crl.der
# authorityInfoAccess     = OCSP;URI:http://ocsp_server_url/

[ ocsp_cert_extension_section]
subjectKeyIdentifier    = hash
authorityKeyIdentifier  = keyid:always, issuer
basicConstraints        = critical, CA:FALSE
keyUsage                = critical, digitalSignature
extendedKeyUsage        = critical, OCSPSigning
# crlDistributionPoints   = URI:http://crl_server_url/intermediate_crl.der
# authorityInfoAccess     = OCSP;URI:http://ocsp_server_url/

[ crl_extension_section ]
authorityKeyIdentifier  = keyid:always, issuer
# crlDistributionPoints   = URI:http://crl_server_url/intermediate_crl.der
# authorityInfoAccess     = OCSP;URI:http://ocsp_server_url/
