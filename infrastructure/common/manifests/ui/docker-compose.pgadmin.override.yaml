services:
  pgadmin:
    # image: dpage/pgadmin4:8.9
    build:
      context: ${COMMON_PGADMIN_CONTEXT}
      dockerfile: ${COMMON_PGADMIN_DOCKERFILE}
    hostname: ${COMMON_PGADMIN_HOST}
    container_name: pgadmin
    user: pgadmin
    entrypoint: ["${COMMON_PGADMIN_ENTRYPOINT_TARGET}"]
    command: ["true"]
    ports:
      - name: pgadmin-port
        target: ${COMMON_PGADMIN_PORT}
        published: ${COMMON_PGADMIN_PUBLIC_PORT}
        host_ip: ${COMMON_PGADMIN_HOST_IP}
        protocol: tcp
        mode: host
    env_file:
      - path: ${COMMON_PGADMIN_ENV}
        required: true
    volumes:
      - type: bind
        source: ${COMMON_PGADMIN_ENTRYPOINT_FOLDER_SOURCE}
        target: ${COMMON_PGADMIN_ENTRYPOINT_FOLDER_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${COMMON_PGADMIN_TEMPLATE_FOLDER_SOURCE}
        target: ${COMMON_PGADMIN_TEMPLATE_FOLDER_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${COMMON_PGADMIN_SSL_CRT_SOURCE}
        target: ${COMMON_PGADMIN_SSL_CRT_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${COMMON_PGADMIN_SSL_KEY_SOURCE}
        target: ${COMMON_PGADMIN_SSL_KEY_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${COMMON_PGADMIN_SSL_CA_CRT_SOURCE}
        target: ${COMMON_PGADMIN_SSL_CA_CRT_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: volume
        source: pgadmin-data
        target: ${COMMON_PGADMIN_STORAGE_FOLDER_TARGET}
        volume:
          nocopy: false
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--silent",
          "--cacert",
          "${COMMON_PGADMIN_SSL_CA_CRT_TARGET}",
          "https://${COMMON_PGADMIN_HOST}:${COMMON_PGADMIN_PORT}/misc/ping",
        ]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s
      start_interval: 10s
    logging:
      driver: json-file
      options:
        labels-regex: "^.+"
    deploy:
      resources:
        limits:
          cpus: ${COMMON_PGADMIN_CPUS_LIMIT}
          memory: ${COMMON_PGADMIN_MEMORY_LIMIT}
        reservations:
          cpus: ${COMMON_PGADMIN_CPUS_RESERVATION}
          memory: ${COMMON_PGADMIN_MEMORY_RESERVATION}
    networks:
      pgadmin-network:
        ipv4_address: ${COMMON_PGADMIN_IP_ADDRESS}
      parser-postgres-network:
    depends_on:
      parser-postgres:
        restart: true
        condition: service_healthy
        required: true
    pull_policy: missing
    restart: always

networks:
  pgadmin-network:
    name: pgadmin-network
    driver: bridge
    internal: false
    external: false
    attachable: false
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: ${COMMON_PGADMIN_NETWORK_SUBNET}
          ip_range: ${COMMON_PGADMIN_NETWORK_IP_RANGE}
          gateway: ${COMMON_PGADMIN_NETWORK_GATEWAY}
  parser-postgres-network:
    external: true

volumes:
  pgadmin-data:
    name: pgadmin-data
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "\
        size=${COMMON_PGADMIN_DATA_SIZE},\
        uid=${COMMON_PGADMIN_VOLUME_UID},\
        gid=${COMMON_PGADMIN_VOLUME_GID}\
        "
