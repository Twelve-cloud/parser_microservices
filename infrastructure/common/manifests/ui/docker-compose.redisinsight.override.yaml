services:
  redis-insight:
    #image: redis/redisinsight:2.60.0
    build:
      context: ${COMMON_REDIS_INSIGHT_CONTEXT}
      dockerfile: ${COMMON_REDIS_INSIGHT_DOCKERFILE}
    hostname: ${COMMON_REDIS_INSIGHT_HOST}
    container_name: redis-insight
    user: node
    entrypoint: ["${COMMON_REDIS_INSIGHT_ENTRYPOINT_TARGET}"]
    command: ["node", "redisinsight/api/dist/src/main"]
    ports:
      - name: redis-insight-port
        target: ${COMMON_REDIS_INSIGHT_PORT}
        published: ${COMMON_REDIS_INSIGHT_PUBLIC_PORT}
        host_ip: ${COMMON_REDIS_INSIGHT_HOST_IP}
        protocol: tcp
        mode: host
    env_file:
      - path: ${COMMON_REDIS_INSIGHT_ENV}
        required: true
    volumes:
      - type: bind
        source: ${COMMON_REDIS_INSIGHT_ENTRYPOINT_FOLDER_SOURCE}
        target: ${COMMON_REDIS_INSIGHT_ENTRYPOINT_FOLDER_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${COMMON_REDIS_INSIGHT_TEMPLATE_FOLDER_SOURCE}
        target: ${COMMON_REDIS_INSIGHT_TEMPLATE_FOLDER_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${COMMON_REDIS_INSIGHT_SSL_CRT_FOLDER_SOURCE}
        target: ${COMMON_REDIS_INSIGHT_SSL_CRT_FOLDER_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ${COMMON_REDIS_INSIGHT_SSL_CA_CRT_SOURCE}
        target: ${COMMON_REDIS_INSIGHT_SSL_CA_CRT_TARGET}
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: volume
        source: redisinsight-data
        target: ${COMMON_REDIS_INSIGHT_STORAGE_FOLDER_TARGET}
        volume:
          nocopy: false
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--silent",
          "--cacert",
          "${COMMON_REDIS_INSIGHT_SSL_CA_CRT_TARGET}",
          "https://${COMMON_REDIS_INSIGHT_HOST}:${COMMON_REDIS_INSIGHT_PORT}/api/health",
        ]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s
      start_interval: 10s
    logging:
      driver: json-file
      options:
        labels-regex: "^.+"
    deploy:
      resources:
        limits:
          cpus: ${COMMON_REDIS_INSIGHT_CPUS_LIMIT}
          memory: ${COMMON_REDIS_INSIGHT_MEMORY_LIMIT}
        reservations:
          cpus: ${COMMON_REDIS_INSIGHT_CPUS_RESERVATION}
          memory: ${COMMON_REDIS_INSIGHT_MEMORY_RESERVATION}
    networks:
      redis-insight-network:
        ipv4_address: ${COMMON_REDIS_INSIGHT_IP_ADDRESS}
      parser-redis-network:
    depends_on:
      parser-redis:
        restart: true
        condition: service_healthy
        required: true
    pull_policy: missing
    restart: always

networks:
  redis-insight-network:
    name: redis-insight-network
    driver: bridge
    internal: false
    external: false
    attachable: false
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: ${COMMON_REDIS_INSIGHT_NETWORK_SUBNET}
          ip_range: ${COMMON_REDIS_INSIGHT_NETWORK_IP_RANGE}
          gateway: ${COMMON_REDIS_INSIGHT_NETWORK_GATEWAY}
  parser-redis-network:
    external: true

volumes:
  redisinsight-data:
    name: redisinsight-data
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "\
        size=${COMMON_REDIS_INSIGHT_DATA_SIZE},\
        uid=${COMMON_REDIS_INSIGHT_VOLUME_UID},\
        gid=${COMMON_REDIS_INSIGHT_VOLUME_GID}\
        "
