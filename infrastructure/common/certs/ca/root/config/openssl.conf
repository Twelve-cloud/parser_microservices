# Predefined section (used in openssl ca command).
[ ca ]
default_ca              = ca_section                                            # Specifies that the default CA settings are defined in the [ca_section].

# Custom section where CA settings described.
[ ca_section ]
dir                     = $ENV::ROOT_CA_DIR                                     # Just variable with root directory of the CA (uses the environment variable ROOT_CA_DIR).

database                = $dir/database/index.txt                               # Path to the database file storing issued certificates.
new_certs_dir           = $dir/issued                                           # Directory where newly issued certificates are saved.

certificate             = $dir/current/ca.crt                                   # Path to the CA’s certificate file.
private_key             = $dir/current/ca.key                                   # Path to the CA’s private key.

rand_serial             = yes                                                   # Generate random serial numbers for certificates (instead of sequential).
unique_subject          = no                                                    # Allow multiple certificates with the same Subject (not enforced).

default_days            = 3650                                                  # Default validity period for certificates (~10 years).
default_md              = default                                               # Default hash algorithm (usually SHA-256, depends on OpenSSL version).

name_opt                = ca_default                                            # Display format for names in output (default settings).
cert_opt                = ca_default                                            # Display format for certificates (default settings).

policy                  = intermediate_cert_policy_section                      # Specifies the policy section for validating Distinguished Names (DN).

x509_extensions         = intermediate_cert_extension_section                   # Specifies the extensions section to include in certificates.
copy_extensions         = copy                                                  # Copy extensions from the Certificate Signing Request (CSR) to the certificate.

# Predefined section (used in openssl req command).
[ req ]
prompt                  = no                                                    # Disable interactive prompts (values are taken from distinguished_name).
distinguished_name      = root_cert_distinguished_name_section                  # Specifies the section containing DN fields for the certificate request.

# Custom section with DN fields for the certificate request.
[ root_cert_distinguished_name_section ]
countryName             = CO                                                    # Country code (e.g., Colombia).
stateOrProvinceName     = stateOrProvinceName                                   # State/Province (default placeholder).
localityName            = localityName                                          # Locality/City (default placeholder).
organizationName        = organizationName                                      # Organization name (default placeholder).
commonName              = Root CA                                               # Common Name (CN) for the Root CA.

[ root_cert_extension_section ]
subjectKeyIdentifier    = hash
authorityKeyIdentifier  = keyid:always, issuer
basicConstraints        = critical, CA:TRUE
keyUsage                = critical, digitalSignature, cRLSign, keyCertSign
# crlDistributionPoints   = URI:http://crl_server_url/root_crl.der

[ intermediate_cert_policy_section ]
countryName             = match
stateOrProvinceName     = match
localityName            = match
organizationName        = match
organizationalUnitName  = optional
emailAddress            = optional
commonName              = supplied

[ intermediate_cert_extension_section ]
subjectKeyIdentifier    = hash
authorityKeyIdentifier  = keyid:always, issuer
basicConstraints        = critical, CA:TRUE, pathlen:0
keyUsage                = critical, digitalSignature, cRLSign, keyCertSign
# crlDistributionPoints   = URI:http://crl_server_url/root_crl.der
