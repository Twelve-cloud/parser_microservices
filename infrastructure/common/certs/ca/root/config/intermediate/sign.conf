[ ca ]                                                                          # Predefined section (used in openssl ca command)
default_ca              = ca_section                                            # Specifies that the default CA settings are defined in the [ca_section]

[ ca_section ]                                                                  # Custom section, where CA settings described
dir                     = $ENV::ROOT_CA_DIR                                     # Just variable with root directory of the CA (uses the environment variable ROOT_CA_DIR)

database                = $dir/database/index.txt                               # Path to the database file storing issued certificates
new_certs_dir           = $dir/issued                                           # Directory where newly issued certificates are saved

certificate             = $dir/current/ca.crt                                   # Path to the ROOT CA’s certificate file for getting info about issuer and include it to the new cert
private_key             = $dir/current/ca.key                                   # Path to the ROOT CA’s private key for signing new cert

rand_serial             = yes                                                   # Generate random serial numbers (security best practice)
unique_subject          = no                                                    # Allow duplicate certificate subjects - DN (because of revocation and recreation of INTERMEDIATE CA certs)

default_days            = 3650                                                  # Default validity period (10 years)
default_md              = sha256                                                # Default hash algorithm (SHA-256)

name_opt                = ca_default                                            # Display format for names in output (default settings)
cert_opt                = ca_default                                            # Display format for certificates (default settings)

policy                  = intermediate_cert_section_policy                      # Specifies the policy section for validating Distinguished Names (DN)

x509_extensions         = intermediate_cert_section_extensions                  # Specifies the extensions section to include in certificates
copy_extensions         = none                                                  # NEVER copy extensions from CSRs (security critical)

[ intermediate_cert_section_policy ]                                            # Custom section, where for validating Distinguished Names (DN)
countryName             = match                                                 # Country in CSR of INTERMEDIATE CA MUST match ROOT CA's country
stateOrProvinceName     = match                                                 # State in CSR of INTERMEDIATE CA MUST match ROOT CA's state
localityName            = match                                                 # Locality in CSR of INTERMEDIATE CA MUST match ROOT CA's locality
organizationName        = match                                                 # Organization in CSR of INTERMEDIATE CA MUST match ROOT CA's organization
organizationalUnitName  = optional                                              # Organizational unit (optional)
emailAddress            = optional                                              # Email address (optional)
commonName              = supplied                                              # Common Name MUST be supplied in CSR of INTERMEDIATE CA

[ intermediate_cert_section_extensions ]                                        # Custom section, where extensions that include in certificate described
basicConstraints        = critical, CA:TRUE, pathlen:0                          # This is a CA certificate (critical)
keyUsage                = critical, cRLSign, keyCertSign                        # Permitted key usages (Can sign another certificates, can sign CRL)
authorityKeyIdentifier  = keyid:always, issuer:always                           # Include authority key ID (ID of the certificate that signed current)
subjectKeyIdentifier    = hash                                                  # Include current certificate ID
