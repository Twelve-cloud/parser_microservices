[ ca ]                                                                          # Predefined section (used in openssl ca command)
default_ca              = ca_section                                            # Specifies that the default CA settings are defined in the [ca_section]

[ ca_section ]                                                                  # Custom section, where CA settings described
dir                     = $ENV::INTERMEDIATE_CA_DIR                             # Just variable with root directory of the CA (uses the environment variable INTERMEDIATE_CA_DIR)

database                = $dir/database/index.txt                               # Path to the database file storing issued certificates
new_certs_dir           = $dir/issued                                           # Directory where newly issued certificates are saved

certificate             = $dir/current/ca.crt                                   # Path to the INTERMEDIATE CA’s certificate file for getting info about issuer and include it to the new cert
private_key             = $dir/current/ca.key                                   # Path to the INTERMEDIATE CA’s private key for signing new cert

rand_serial             = yes                                                   # Generate random serial numbers (security best practice)
unique_subject          = no                                                    # Allow duplicate certificate subjects - DN (because of revocation and recreation of LEAF certs)

default_days            = 3650                                                  # Default validity period (10 years)
default_md              = sha256                                                # Default hash algorithm (SHA-256)

name_opt                = ca_default                                            # Display format for names in output (default settings)
cert_opt                = ca_default                                            # Display format for certificates (default settings)

policy                  = leaf_cert_section_policy                              # Specifies the policy section for validating Distinguished Names (DN)

x509_extensions         = leaf_cert_section_extensions                          # Specifies the extensions section to include in certificates
copy_extensions         = copy                                                  # Allow copy extensions from CSRs (SAN, extendedKeyUsage, etc...)

[ leaf_cert_section_policy ]
countryName             = optional                                              # Country (optional)
stateOrProvinceName     = optional                                              # State (optional)
localityName            = optional                                              # Locality (optional)
organizationName        = optional                                              # Organization (optional)
organizationalUnitName  = optional                                              # Organizational unit (optional)
emailAddress            = optional                                              # Email address (optional)
commonName              = supplied                                              # Common Name MUST be supplied in CSR of LEAF certificate

[ leaf_cert_section_extensions ]                                                # Custom section, where extensions that include in certificate described
basicConstraints        = critical, CA:FALSE                                    # This is not a CA certificate (critical)
keyUsage                = critical, digitalSignature                            # Permitted key usages (Can sign handshake transcript during TLS 1.3 handshake)
extendedKeyUsage        = critical, serverAuth, clientAuth                      # Can be used for server auth and client auth
authorityKeyIdentifier  = keyid:always, issuer:always                           # Include authority key ID (ID of the certificate that signed current)
subjectKeyIdentifier    = hash                                                  # Include current certificate ID
