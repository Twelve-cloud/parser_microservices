# Predefined section (used in openssl req command).
[ req ]
prompt                  = no                                                    # Disable interactive prompts.
distinguished_name      = intermediate_cert_section_distinguished_name          # Section, where DN of CSR described (will be DN of Intermediate CA).
req_extensions          = intermediate_cert_section_req_extensions              # Section, where extensions of Intermediate CA CSR described.

# Custom section, where DN of CSR described (will be DN of Intermediate CA).
[ intermediate_cert_section_distinguished_name ]
countryName             = CO                                                    # Country name placeholder.
stateOrProvinceName     = stateOrProvinceName                                   # State/Province placeholder.
localityName            = localityName                                          # City/Locality placeholder.
organizationName        = organizationName                                      # Organization placeholder.
commonName              = Intermediate CA                                       # Common Name for Intermediate CA.

# Custom section, where extensions of Intermediate CA CSR described.
[ intermediate_cert_section_req_extensions ]
basicConstraints        = critical, CA:TRUE, pathlen:0                          # This is a CA certificate with ability to sign only leaf certificates with CA:FALSE (critical).
keyUsage                = critical, digitalSignature, cRLSign, keyCertSign      # Permitted key usages (Can sign another certificates, can sign CRL, can be used in DS).

# Predefined section (used in openssl ca command).
[ ca ]
default_ca              = ca_section                                            # Specifies that the default CA settings are defined in the [ca_section].

# Custom section, where CA settings described.
[ ca_section ]
dir                     = $ENV::INTERMEDIATE_CA_DIR                             # Just variable with intermediate directory of the CA (uses the environment variable INTERMEDIATE_CA_DIR).

database                = $dir/database/index.txt                               # Path to the database file storing issued certificates.
new_certs_dir           = $dir/issued                                           # Directory where newly issued certificates are saved.

certificate             = $dir/current/ca.crt                                   # Path to the CA’s certificate file.
private_key             = $dir/current/ca.key                                   # Path to the CA’s private key.

rand_serial             = yes                                                   # Generate random serial numbers (security best practice).
unique_subject          = no                                                    # Allow duplicate certificate subjects (DN).

default_days            = 3650                                                  # Default validity period (10 years)
default_md              = sha256                                                # Default hash algorithm (SHA-256)

name_opt                = ca_default                                            # Display format for names in output (default settings).
cert_opt                = ca_default                                            # Display format for certificates (default settings).

policy                  = leaf_cert_section_policy                              # Specifies the policy section for validating Distinguished Names (DN).

x509_extensions         = leaf_cert_section_extensions                          # Specifies the extensions section to include in certificates.
copy_extensions         = copy                                                  # Allow copy extensions from CSRs.

[ leaf_cert_section_policy ]
countryName             = optional                                              # Country (optional).
stateOrProvinceName     = optional                                              # State (optional).
localityName            = optional                                              # Locality (optional).
organizationName        = optional                                              # Organization (optional).
organizationalUnitName  = optional                                              # Organizational unit (optional).
emailAddress            = optional                                              # Email address (optional).
commonName              = supplied                                              # Common Name MUST be provided (value not enforced).

[ leaf_cert_section_extensions ]
subjectKeyIdentifier    = hash                                                  # Automatically generate subject key ID (current certificate ID).
authorityKeyIdentifier  = keyid:always, issuer                                  # Include authority key ID (ID of the certificate that signed current).
basicConstraints        = critical, CA:FALSE                                    # This is a leaf certificate (critical).
keyUsage                = critical, digitalSignature, keyEncipherment           # Permitted key usages (Can encipther keys, can be used in DS).
extendedKeyUsage        = critical, serverAuth, clientAuth                      # Can be used for server/client auth.
