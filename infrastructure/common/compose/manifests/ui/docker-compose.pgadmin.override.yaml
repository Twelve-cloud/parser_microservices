services:
  pgadmin:
    # image: dpage/pgadmin4:8.9
    build: ./infrastructure/common/compose/docker/ui/pgadmin
    hostname: pgadmin
    container_name: pgadmin
    user: pgadmin
    entrypoint: ["/bin/pgadmin/entrypoint.sh"]
    command: ["true"]
    ports:
      - name: pgadmin-port
        target: ${COMPOSE_COMMON_PGADMIN_PORT}
        published: ${COMPOSE_COMMON_PGADMIN_PUBLIC_PORT}
        host_ip: ${COMPOSE_COMMON_PGADMIN_HOST_IP}
        protocol: tcp
        mode: host
    env_file:
      - path: ./infrastructure/common/compose/env/ui/pgadmin/.env
        required: true
    volumes:
      - type: bind
        source: ./infrastructure/common/compose/entrypoints/ui/pgadmin
        target: /bin/pgadmin
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ./infrastructure/common/compose/configs/ui/pgadmin
        target: /etc/templates/pgadmin
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ./infrastructure/common/compose/certs/ui/pgadmin/server.crt
        target: /certs/server.cert
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ./infrastructure/common/compose/certs/ui/pgadmin/server.key
        target: /certs/server.key
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: bind
        source: ./infrastructure/common/compose/certs/ca/ca.crt
        target: /home/pgadmin/.postgresql/root.crt
        read_only: true
        bind:
          propagation: rprivate
          create_host_path: true
          selinux: Z
      - type: volume
        source: pgadmin-data
        target: /storage/pgadmin
        volume:
          nocopy: false
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "--no-check-certificate",
          "https://${COMPOSE_COMMON_PGADMIN_HOST}:${COMPOSE_COMMON_PGADMIN_PORT}/misc/ping",
        ]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s
      start_interval: 10s
    logging:
      driver: json-file
      options:
        labels-regex: "^.+"
    deploy:
      resources:
        limits:
          cpus: ${COMPOSE_COMMON_PGADMIN_CPUS_LIMIT}
          memory: ${COMPOSE_COMMON_PGADMIN_MEMORY_LIMIT}
        reservations:
          cpus: ${COMPOSE_COMMON_PGADMIN_CPUS_RESERVATION}
          memory: ${COMPOSE_COMMON_PGADMIN_MEMORY_RESERVATION}
    networks:
      pgadmin-network:
        ipv4_address: ${COMPOSE_COMMON_PGADMIN_IP_ADDRESS}
      parser-postgres-network:
    depends_on:
      parser-postgres:
        restart: true
        condition: service_healthy
        required: true
    pull_policy: missing
    restart: always

networks:
  pgadmin-network:
    name: pgadmin-network
    driver: bridge
    internal: false
    external: false
    attachable: false
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: ${COMPOSE_COMMON_PGADMIN_NETWORK_SUBNET}
          ip_range: ${COMPOSE_COMMON_PGADMIN_NETWORK_IP_RANGE}
          gateway: ${COMPOSE_COMMON_PGADMIN_NETWORK_GATEWAY}
  parser-postgres-network:
    external: true

volumes:
  pgadmin-data:
    name: pgadmin-data
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "\
        size=${COMPOSE_COMMON_PGADMIN_DATA_SIZE},\
        uid=${COMPOSE_COMMON_PGADMIN_VOLUME_UID},\
        gid=${COMPOSE_COMMON_PGADMIN_VOLUME_GID}\
        "
